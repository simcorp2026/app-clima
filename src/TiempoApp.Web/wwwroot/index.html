<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Consulta el clima actual de cualquier ciudad.">
  <meta name="color-scheme" content="light dark">
  <title>TiempoApp</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⛅</text></svg>">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="shell">
    <header class="brand">
      <span class="brand__mark" aria-hidden="true">⛅</span>
      <div>
        <h1 class="brand__name">TiempoApp</h1>
        <p class="brand__tagline">El clima actual de cualquier ciudad</p>
      </div>
    </header>

    <form id="search-form" class="search" role="search" autocomplete="off" novalidate>
      <label class="visually-hidden" for="city">Ciudad</label>
      <input id="city" name="city" class="search__input" type="search" maxlength="100"
             placeholder="Ciudad, p. ej. Quito" required>
      <button id="search-button" class="search__button" type="submit" aria-label="Buscar">
        <span class="spinner" aria-hidden="true"></span>
        <svg class="search__icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <span class="search__label">Buscar</span>
      </button>
    </form>

    <nav class="chips" aria-label="Ciudades de ejemplo">
      <button type="button" class="chip" data-city="Quito">Quito</button>
      <button type="button" class="chip" data-city="Bogotá">Bogotá</button>
      <button type="button" class="chip" data-city="Lima">Lima</button>
      <button type="button" class="chip" data-city="Ciudad de México">Ciudad de México</button>
      <button type="button" class="chip" data-city="Madrid">Madrid</button>
      <button type="button" class="chip" data-city="Buenos Aires">Buenos Aires</button>
    </nav>

    <section class="result" aria-live="polite" aria-busy="false" id="result">
      <!-- Empty state -->
      <div class="state state--empty" data-state="empty">
        <p>Escribe el nombre de una ciudad para ver su temperatura, humedad y viento.</p>
        <p class="hint">Si hay ciudades con el mismo nombre, añade el país: <code>Valencia,VE</code></p>
      </div>

      <!-- Loading skeleton -->
      <div class="card card--skeleton" data-state="loading" hidden aria-label="Cargando">
        <div class="sk sk--line"></div>
        <div class="sk sk--hero"></div>
        <div class="sk sk--stats"></div>
      </div>

      <!-- Error -->
      <div class="state state--error" data-state="error" role="alert" hidden>
        <p class="state__title" id="error-title">No se pudo obtener el clima</p>
        <p id="error-detail"></p>
      </div>

      <!-- Weather card -->
      <article class="card" data-state="success" hidden>
        <header class="card__header">
          <div>
            <h2 class="card__city" id="w-city"></h2>
            <p class="card__country" id="w-country"></p>
          </div>
          <p class="card__time" id="w-time"></p>
        </header>

        <div class="card__hero">
          <img class="card__icon" id="w-icon" alt="" width="100" height="100">
          <div>
            <p class="card__temp"><span id="w-temp"></span><span class="card__unit" id="w-unit"></span></p>
            <p class="card__desc" id="w-desc"></p>
          </div>
        </div>

        <dl class="stats">
          <div class="stat">
            <dt>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 14.76V3.5a2.5 2.5 0 0 0-5 0v11.26a4.5 4.5 0 1 0 5 0Z"/></svg>
              Sensación
            </dt>
            <dd id="w-feels"></dd>
          </div>
          <div class="stat">
            <dt>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.7s-6 6.6-6 11.1a6 6 0 0 0 12 0c0-4.5-6-11.1-6-11.1Z"/></svg>
              Humedad
            </dt>
            <dd id="w-humidity"></dd>
          </div>
          <div class="stat">
            <dt>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8h11a3 3 0 1 0-3-3M3 12h16a3 3 0 1 1-3 3M3 16h7"/></svg>
              Viento
            </dt>
            <dd id="w-wind"></dd>
          </div>
        </dl>
      </article>
    </section>

    <footer class="footer">
      Datos de <a href="https://openweathermap.org/" target="_blank" rel="noopener">OpenWeatherMap</a>
    </footer>
  </main>

  <script src="app.js" defer></script>
</body>
</html>
